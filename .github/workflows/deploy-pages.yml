name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 5 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r data_pipeline/requirements.txt
      - name: Build seed dashboard data
        if: github.event_name == 'push'
        run: python data_pipeline/build_dashboard_data.py
      - name: Scrape fresh dashboard data
        if: github.event_name != 'push'
        run: python data_pipeline/build_dashboard_data.py --scrape
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
