name: Deploy dashboard to GitHub Pages

on:
  push:
  schedule:
    # 12:30 UTC = 18:00 IST — MCP discovery for T+1
    - cron: "30 12 * * 1-5"
    # 22:30 UTC = 04:00 IST — price-daily + fundamentals due (Mon-Fri, Sat/Sun disabled)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      data_mode:
        description: "Data refresh mode"
        required: true
        default: "scrape"
        type: choice
        options:
          - scrape
          - test-scrape
          - seed
          - price-only
          - fundamentals
          - from-db
          - discover
          - seed-db
      symbol_offset:
        description: "Start scraping from this NSE symbol offset"
        required: false
        default: "0"
      symbol_limit:
        description: "Optional max symbols to scrape. Leave blank for full scrape."
        required: false
        default: ""
  repository_dispatch:
    types: [refresh-data]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            data_pipeline/requirements.txt
            data_pipeline/requirements-dev.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install Python dependencies
        run: |
          python -m pip install -r data_pipeline/requirements.txt
          python -m pip install -r data_pipeline/requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest data_pipeline/tests -q
      - name: Build dashboard data
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          DATA_MODE: ${{ github.event.inputs.data_mode || github.event.client_payload.data_mode || '' }}
          SYMBOL_OFFSET: ${{ github.event.inputs.symbol_offset || github.event.client_payload.symbol_offset || '0' }}
          SYMBOL_LIMIT: ${{ github.event.inputs.symbol_limit || github.event.client_payload.symbol_limit || '' }}
          DATABASE_URL: sqlite:///.cache/central.db
          MF_FUNDAMENTAL_LAG_DAYS: "1"
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            rm -f .cache/magic_formula/stock_data_master.csv
            if python data_pipeline/build_dashboard_data.py --scrape; then
              exit 0
            fi
            echo "::warning::Live scrape failed (Moneycontrol likely blocking runner IP); deploying with committed latest.json"
            exit 0
          fi

          if [[ "${DATA_MODE}" == "seed" ]]; then
            python data_pipeline/build_dashboard_data.py
            exit 0
          fi

          if [[ "${DATA_MODE}" == "test-scrape" ]]; then
            python data_pipeline/build_dashboard_data.py --scrape --symbol-offset "${SYMBOL_OFFSET:-0}" --symbol-limit "${SYMBOL_LIMIT:-50}"
            exit 0
          fi

          if [[ "${DATA_MODE}" == "price-only" ]]; then
            python data_pipeline/build_dashboard_data.py --price-only --symbol-offset "${SYMBOL_OFFSET:-0}" --symbol-limit "${SYMBOL_LIMIT:-}"
            exit 0
          fi
          if [[ "${DATA_MODE}" == "fundamentals" ]]; then
            python data_pipeline/build_dashboard_data.py --fundamentals
            exit 0
          fi
          if [[ "${DATA_MODE}" == "from-db" ]]; then
            python data_pipeline/build_dashboard_data.py --from-db
            exit 0
          fi
          if [[ "${DATA_MODE}" == "discover" ]]; then
            python data_pipeline/discover_earnings.py
            exit 0
          fi
          if [[ "${DATA_MODE}" == "seed-db" ]]; then
            python data_pipeline/seed_db.py
            python data_pipeline/build_dashboard_data.py --from-db
            exit 0
          fi

          # Scheduled runs: Mon-Fri 12:30 UTC (discover) and 22:30 UTC (price+fundamentals)
          HOUR_UTC=$(date -u +%H)
          if [[ "${HOUR_UTC}" == "12" ]]; then
            echo "[Schedule] 12:30 UTC discover for T+1"
            python data_pipeline/discover_earnings.py || echo "::warning::discover failed, continuing"
            # Also run stale fundamentals backfill lightly
            exit 0
          fi

          # Default scheduled build (22:30 UTC): price-daily + fundamentals due -> from DB
          echo "[Schedule] 22:30 UTC price-daily + fundamentals -> DB"
          # Ensure DB has instruments + seed if empty
          if [[ ! -f .cache/central.db ]]; then
            echo "[Init] seeding DB from seed CSV"
            python data_pipeline/seed_db.py || echo "::warning::seed_db failed"
          fi
          python data_pipeline/discover_earnings.py || echo "::warning::discover failed"
          # Price daily (overview only, ~2000 req vs 8000)
          if ! python data_pipeline/build_dashboard_data.py --price-only; then
            echo "::warning::price-only failed, trying fallback from-db"
          fi
          # Fundamentals for due symbols (calendar + lag=1 trading day)
          if ! python data_pipeline/build_dashboard_data.py --fundamentals; then
            echo "::warning::fundamentals failed"
          fi
          python data_pipeline/build_dashboard_data.py --from-db
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_BASE_URL: https://mf-dashboard-three.vercel.app
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Vercel
        run: npx vercel --prod --token "${{ secrets.VERCEL_TOKEN }}" --yes

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
